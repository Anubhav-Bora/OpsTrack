<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="50" fill="url(#bgGradient)"/>
  
  <!-- Isometric cubes -->
  <g transform="translate(100, 100)">
    <!-- Top cube -->
    <g>
      <!-- Top face -->
      <polygon points="0,-50 30,-35 0,-20 -30,-35" fill="#ffffff" opacity="0.95"/>
      <!-- Left face -->
      <polygon points="-30,-35 -30,5 0,20 0,-20" fill="#ffffff" opacity="0.8"/>
      <!-- Right face -->
      <polygon points="30,-35 30,5 0,20 0,-20" fill="#ffffff" opacity="0.9"/>
    </g>
    
    <!-- Bottom left cube -->
    <g transform="translate(-40, 30)">
      <!-- Top face -->
      <polygon points="0,-50 30,-35 0,-20 -30,-35" fill="#ffffff" opacity="0.95"/>
      <!-- Left face -->
      <polygon points="-30,-35 -30,5 0,20 0,-20" fill="#ffffff" opacity="0.8"/>
      <!-- Right face -->
      <polygon points="30,-35 30,5 0,20 0,-20" fill="#ffffff" opacity="0.9"/>
    </g>
    
    <!-- Bottom right cube -->
    <g transform="translate(40, 30)">
      <!-- Top face -->
      <polygon points="0,-50 30,-35 0,-20 -30,-35" fill="#ffffff" opacity="0.95"/>
      <!-- Left face -->
      <polygon points="-30,-35 -30,5 0,20 0,-20" fill="#ffffff" opacity="0.8"/>
      <!-- Right face -->
      <polygon points="30,-35 30,5 0,20 0,-20" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
